name: CI - Build & Test Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Test, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildingos
          POSTGRES_PASSWORD: buildingos-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: buildingos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://buildingos:buildingos-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/buildingos?schema=public
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build internal packages
        run: npm run build:packages

      - name: 🧬 Generate Prisma client
        run: npm run prisma:generate -w apps/api

      - name: 🗂️ Setup database
        run: npm run migrate:deploy -w apps/api

      - name: 🔍 Lint
        run: npm run lint:ci
        continue-on-error: false

      - name: 🧪 Unit & Integration Tests
        run: npm run test:ci
        continue-on-error: false

      - name: 🛡️ Recovery-point portable-stat regressions
        timeout-minutes: 10
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 120s bash scripts/tests/production-s3-write-fence.test.sh
          timeout 120s bash scripts/tests/recovery-point-postgres-snapshot.test.sh
          timeout 120s bash scripts/tests/recovery-point-file-manifest.test.sh
          timeout 120s bash scripts/tests/recovery-point-object-source.test.sh
          timeout 120s bash scripts/tests/recovery-point-file-object-bundle.test.sh
          timeout 120s bash scripts/tests/recovery-point-capture.test.sh
          timeout 120s bash scripts/tests/production-rclone-recovery-check.test.sh
          timeout 120s bash scripts/tests/recovery-point-portable-stat.test.sh

      - name: 🧪 E2E Tests (API)
        run: npm run test:e2e:ci
        continue-on-error: false

      - name: 🏗️ Build
        run: npm run build:ci
        continue-on-error: false

      - name: ✨ Build Success
        if: success()
        run: echo "✅ All checks passed! Ready to merge."
